<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileSearch — Find & Download Resources</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- ── HEADER ── -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">🔍</span>
          <span class="logo-text">FileSearch</span>
        </div>
        <p class="tagline">Find & Download Learning Resources Instantly</p>
      </div>
    </header>

    <!-- ── SEARCH SECTION ── -->
    <section class="search-section">
      <div class="search-wrapper">
        <div class="search-box">
          <i class="fa fa-search search-icon"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search files by name, topic, or keyword…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clearBtn" class="clear-btn" title="Clear search">
            <i class="fa fa-times"></i>
          </button>
        </div>

        <!-- Category Filter Pills -->
        <div class="category-pills" id="categoryPills">
          <button class="pill active" data-cat="all">All</button>
          <button class="pill" data-cat="Programming">Programming</button>
          <button class="pill" data-cat="Frontend">Frontend</button>
          <button class="pill" data-cat="Backend">Backend</button>
          <button class="pill" data-cat="Design">Design</button>
          <button class="pill" data-cat="Database">Database</button>
          <button class="pill" data-cat="Tools">Tools</button>
          <button class="pill" data-cat="Web">Web</button>
        </div>
      </div>
    </section>

    <!-- ── RESULTS ── -->
    <main class="main">
      <div class="results-header">
        <span id="resultsCount" class="results-count">Loading files…</span>
      </div>

      <!-- Skeleton loader -->
      <div id="skeletonGrid" class="card-grid">
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
      </div>

      <div id="cardGrid" class="card-grid hidden"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">😕</div>
        <h3>No files found</h3>
        <p>Try a different keyword or browse all categories.</p>
        <button onclick="resetSearch()" class="btn-reset">Show All Files</button>
      </div>
    </main>

    <!-- ── FOOTER ── -->
    <footer class="footer">
      <p>Built with ❤️ using <strong>Express.js</strong> &amp; Vanilla JS</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
